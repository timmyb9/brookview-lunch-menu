name: Update Lunch Menu

on:
  schedule:
    # Runs 6:00am and 1:00pm Central (11:00 and 18:00 UTC) every day
    - cron: '0 11 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python generate_html.py

      - name: Commit and push if changed
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Update lunch menu"
          git push
