name: Update Lunch Menu

on:
  schedule:
    # Runs once, ~1:00am Central (1am CDT / midnight CST - GitHub cron
    # doesn't shift for DST, but this lands after local midnight either
    # way so "today" always resolves to the correct upcoming day).
    # GitHub Actions scheduled runs can be delayed by GitHub's queue
    # (observed up to ~4 hours on this repo), so this is scheduled with
    # plenty of buffer ahead of the 7am Central viewing window.
    - cron: '10 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python generate_html.py

      - name: Commit and push if changed
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Update lunch menu"
          git push
